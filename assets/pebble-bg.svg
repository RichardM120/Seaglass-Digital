  <defs>
    <radialGradient id="heroGlassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DCEFE6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DCEFE6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroGlassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A9CEBC"/>
      <stop offset="100%" stop-color="#6E9C87"/>
    </linearGradient>
    <filter id="heroFrost" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <style>
    .hero-glass-piece{ animation:heroGlassBreathe 9s ease-in-out infinite; }
    @keyframes heroGlassBreathe{
      0%{ transform:scale(1); }
      50%{ transform:scale(1.035); }
      100%{ transform:scale(1); }
    }
    .hero-glass-glow{ animation:heroGlowPulse 9s ease-in-out infinite; }
    @keyframes heroGlowPulse{
      0%{ opacity:0.35; }
      50%{ opacity:0.7; }
      100%{ opacity:0.35; }
    }
    .hero-glint{ opacity:0; }
    .hero-glint.g1{ animation:heroTwinkle 6s ease-in-out infinite 0.5s; }
    .hero-glint.g2{ animation:heroTwinkle 5s ease-in-out infinite 2.4s; }
    .hero-glint.g3{ animation:heroTwinkle 7s ease-in-out infinite 4s; }
    @keyframes heroTwinkle{
      0%,80%,100%{ opacity:0; transform:scale(0.6); }
      90%{ opacity:0.95; transform:scale(1.25); }
    }
    @media (prefers-reduced-motion: reduce){
      *{ animation-duration:0.001ms !important; }
    }
  </style>
